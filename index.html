<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #1a73e8;
            text-align: center;
        }
        .calculator-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .calculator-layout {
                grid-template-columns: 320px 1fr;
            }
        }
        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e4e8;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e8f0fe;
            border-left: 5px solid #1a73e8;
            border-radius: 4px;
        }
        .result-title {
            font-size: 14px;
            color: #1967d2;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 22px;
            font-weight: bold;
            color: #111;
            font-family: monospace;
        }
        .graph-area {
            position: relative;
            min-height: 350px;
            border: 1px solid #e0e4e8;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Definite Integration Calculator</h1>
    
    <div class="calculator-layout">
        <div class="sidebar">
            <div class="input-group">
                <label for="function-input">Function f(x)</label>
                <input type="text" id="function-input" value="x^2 - 2x + 1" placeholder="e.g., sin(x), x^2, exp(x)">
                <div id="error-message" class="error">Invalid expression</div>
            </div>
            
            <div class="input-group">
                <label for="lower-bound">Lower Bound (a)</label>
                <input type="number" id="lower-bound" value="0" step="any">
            </div>
            
            <div class="input-group">
                <label for="upper-bound">Upper Bound (b)</label>
                <input type="number" id="upper-bound" value="3" step="any">
            </div>
            
            <div class="result-box">
                <div class="result-title">Definite Integral Value</div>
                <div id="result" class="result-value">0.0000</div>
            </div>
        </div>
        
        <div class="graph-area">
            <canvas id="myChart"></canvas>
        </div>
    </div>
</div>

<script>
    let myChart = null;

    // Helper function to safely parse and evaluate expressions
    function evaluateMath(expr, xVal) {
        return math.evaluate(expr, { x: xVal });
    }

    // Numerical integration using Simpson's Rule
    function integrate(expr, a, b, n = 1000) {
        if (n % 2 !== 0) n++; // Simpson's rule requires an even number of intervals
        const h = (b - a) / n;
        let sum = evaluateMath(expr, a) + evaluateMath(expr, b);

        for (let i = 1; i < n; i++) {
            const x = a + i * h;
            sum += evaluateMath(expr, x) * (i % 2 === 0 ? 2 : 4);
        }
        return (h / 3) * sum;
    }

    function calculateAndPlot() {
        const exprInput = document.getElementById('function-input').value;
        const a = parseFloat(document.getElementById('lower-bound').value);
        const b = parseFloat(document.getElementById('upper-bound').value);
        const errorDiv = document.getElementById('error-message');
        
        if (isNaN(a) || isNaN(b)) return;

        try {
            errorDiv.style.display = 'none';
            // Validate the expression first
            evaluateMath(exprInput, a);
            
            // 1. Calculate Integral
            const integralResult = integrate(exprInput, a, b);
            document.getElementById('result').innerText = integralResult.toFixed(4);

            // 2. Generate Graph Data
            // Determine a dynamic X range to show context around bounds
            const padding = Math.max(Math.abs(b - a) * 0.5, 2);
            const xMin = Math.min(a, b) - padding;
            const xMax = Math.max(a, b) + padding;
            
            const points = 200;
            const step = (xMax - xMin) / points;
            
            const mainLineData = [];
            const shadedData = [];

            for (let i = 0; i <= points; i++) {
                const x = xMin + (i * step);
                let y;
                try {
                    y = evaluateMath(exprInput, x);
                } catch(e) {
                    y = null;
                }

                if (typeof y === 'number' && !isNaN(y) && isFinite(y)) {
                    mainLineData.push({ x: x, y: y });
                    
                    // Populate data points specifically meant for the shaded integral region
                    if (x >= Math.min(a, b) && x <= Math.max(a, b)) {
                        shadedData.push({ x: x, y: y });
                    }
                }
            }

            // Ensure the shaded region connects seamlessly to the bounds
            shadedData.unshift({ x: Math.min(a,b), y: evaluateMath(exprInput, Math.min(a,b)) });
            shadedData.push({ x: Math.max(a,b), y: evaluateMath(exprInput, Math.max(a,b)) });

            // 3. Update or Render Chart.js Graph
            if (myChart) {
                myChart.destroy();
            }

            const ctx = document.getElementById('myChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: `f(x) = ${exprInput}`,
                            data: mainLineData,
                            borderColor: '#1a73e8',
                            borderWidth: 2.5,
                            pointRadius: 0,
                            fill: false,
                            tension: 0.1
                        },
                        {
                            label: 'Integrated Area',
                            data: shadedData,
                            backgroundColor: 'rgba(26, 115, 232, 0.25)',
                            borderColor: 'transparent',
                            pointRadius: 0,
                            fill: 'origin', // Fills down to the x-axis (y=0)
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            grid: { color: '#eef0f4' }
                        },
                        y: {
                            type: 'linear',
                            grid: { color: '#eef0f4' }
                        }
                    },
                    plugins: {
                        legend: { display: true }
                    }
                }
            });

        } catch (err) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Error parsing expression.";
        }
    }

    // Event listeners to dynamically update on text change or inputs
    document.getElementById('function-input').addEventListener('input', calculateAndPlot);
    document.getElementById('lower-bound').addEventListener('input', calculateAndPlot);
    document.getElementById('upper-bound').addEventListener('input', calculateAndPlot);

    // Initial load run
    window.onload = calculateAndPlot;
</script>

</body>
</html>
